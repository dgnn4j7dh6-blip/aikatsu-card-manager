<body><header><div class="headInner"><h1>🌸 アイカツアンコール カード管理</h1><div class="sub">アイカツ！アンコール カード管理</div></div></header>
<main class="container"><nav class="mainNav"><button id="collectionNav" class="active" onclick="setPage('collection')">📚 コレクション</button><button id="saleNav" onclick="setPage('sale')">🛍️ 売却用 <span id="saleBadge"></span></button></nav>
<section id="collectionPage"><section class="progress"><div class="progressTop"><span>コレクション達成率</span><span id="rate">0%</span></div><div class="bar"><div id="bar" style="width:0%"></div></div><div id="summary" style="font-size:12px;margin-top:8px;color:#806f7d"></div></section><input id="search" class="search" placeholder="🔍 カード番号・カード名で検索"><div class="categoryTabs" role="tablist" aria-label="カード種類"><button class="categoryTab active" data-category="first">🌸 第一弾</button><button class="categoryTab" data-category="parallel">✨ 第一弾（パラレル）</button><button class="categoryTab" data-category="promo">🎁 プロモーション</button></div><div id="categoryHint" class="categoryHint">第一弾の通常カード</div><div class="filters"><button class="filter active" data-filter="all">すべて</button><button class="filter" data-filter="owned">所持</button><button class="filter" data-filter="missing">未所持</button><button class="filter" data-filter="double">ダブり</button></div><div id="grid" class="grid"></div></section>
<section id="salePage" style="display:none"><section class="saleSummary"><div class="saleSummaryTop"><div><div style="font-weight:900;font-size:17px">🛍️ 売却用リスト</div><div id="saleMeta" class="saleMeta"></div></div><div id="saleTotal" class="saleTotal">¥0</div></div><div class="saleFilters"><button class="saleFilter active" data-sale-filter="planned">売却予定</button><button class="saleFilter" data-sale-filter="sold">売却済み</button><button class="saleFilter" data-sale-filter="all">すべて</button></div></section><div id="saleList"></div><div class="backup"><div class="backupTitle">📱 データのバックアップ</div><div class="backupText">機種変更やブラウザのデータ消去に備えて、カード情報をファイルに保存できます。</div><div class="backupBtns"><button onclick="exportData()">バックアップ</button><button onclick="document.getElementById('importFile').click()">復元</button></div><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(event)"></div></section>
<div class="note">※カード画像は「アイカツ！アンコール」公式サイトの画像を表示しています。<br>※所持数・価格・売却情報は、このブラウザの端末内に保存されます。別端末とは自動同期されません。</div></main>
<div id="modal" class="modal" onclick="if(event.target===this)closeDetail()"><div class="sheet"><button class="close" onclick="closeDetail()">×</button><h2 id="detailTitle" style="margin:4px 45px 10px 0;font-size:19px"></h2><div class="detailImg"><img id="detailImg" alt="カード画像"></div><div class="field"><label>所持枚数</label><div class="qty" style="justify-content:center"><button onclick="detailQty(-1)">−</button><span id="detailQty" class="count" style="font-size:18px">0</span><button onclick="detailQty(1)">＋</button></div></div><div class="field"><label>売却リスト</label><button id="quickSale" class="quickSale" onclick="toggleQuickSale()">🛍️ 売却予定にする</button></div><div class="field"><label>💰 買取価格（1枚）</label><input id="buyPrice" type="number" min="0" inputmode="numeric" placeholder="例：500"></div><div class="field"><label>🏷️ 売却予定価格（1枚）</label><input id="sellPrice" type="number" min="0" inputmode="numeric" placeholder="例：800"></div><div class="field"><label>🏪 買取店・購入先</label><input id="buyShop" placeholder="例：カードショップ○○"></div><div class="field"><label>状態</label><select id="condition"><option>未設定</option><option>美品</option><option>良品</option><option>傷あり</option><option>ジャンク</option></select></div><div class="field"><label>売却ステータス</label><select id="saleStatus" onchange="syncQuickSale()"><option value="none">売却リストに入れない</option><option value="planned">売却予定</option><option value="sold">売却済み</option></select></div><div class="field"><label>メモ</label><textarea id="memo" rows="3" placeholder="出品先・セット内容・注意点など"></textarea></div><div class="detailActions"><button class="secondaryBtn" onclick="closeDetail()">キャンセル</button><button class="saveBtn" onclick="saveDetail()">保存する</button></div></div></div><div id="toast" class="toast"></div>

const savedCards=JSON.parse(localStorage.getItem('aikatsu_cards_v2')||'null');const cardCode=c=>{const v=Array.isArray(c.code)?c.code[0]:c.code;return String(v||'').replace(/^\['|\']$/g,'');};let cards=savedCards?(()=>{const matched=new Set();const merged=initial.map(fresh=>{const old=savedCards.find((x,i)=>!matched.has(i)&&(Number(x.id)===Number(fresh.id)||cardCode(x)===fresh.code));if(!old)return fresh;matched.add(savedCards.indexOf(old));return {...fresh,...old,code:fresh.code,name:fresh.name,type:fresh.type,brand:fresh.brand,image:fresh.image,parallel:fresh.parallel};});savedCards.forEach((old,i)=>{if(!matched.has(i)&&!merged.some(x=>Number(x.id)===Number(old.id)||cardCode(x)===cardCode(old)))merged.push({...old,code:cardCode(old)});});return merged;})():initial;let page='collection',filter='all',saleFilter='planned',detailId=null,category='first';
function normalize(){cards=cards.map(c=>({...c,code:Array.isArray(c.code)?c.code[0]:c.code,name:Array.isArray(c.name)?c.name[0]:c.name,image:(Array.isArray(c.image)?c.image[0]:c.image).replace("['E1-50_ER']","E1-50_ER"),saleStatus:c.saleStatus||'none',qty:Number(c.qty)||0}));}
normalize();function save(){localStorage.setItem('aikatsu_cards_v2',JSON.stringify(cards));}
function setPage(p){page=p;document.getElementById('collectionPage').style.display=p==='collection'?'block':'none';document.getElementById('salePage').style.display=p==='sale'?'block':'none';document.getElementById('collectionNav').classList.toggle('active',p==='collection');document.getElementById('saleNav').classList.toggle('active',p==='sale');if(p==='sale')renderSale();else render();}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const list=cards.filter(c=>{const isPromo=String(Array.isArray(c.code)?c.code[0]:c.code).includes('EP-')||String(c.type).includes('プロモーション');const isParallel=!!c.parallel;const inCategory=category==='promo'?isPromo:category==='parallel'?isParallel:(!isPromo&&!isParallel);const text=(cardCode(c)+' '+c.name+' '+c.brand+' '+c.type).toLowerCase();const match=!q||text.includes(q);const f=filter==='all'||(filter==='owned'&&c.qty>0)||(filter==='missing'&&c.qty===0)||(filter==='double'&&c.qty>1);return inCategory&&match&&f;});document.getElementById('categoryHint').textContent=category==='first'?'第一弾の通常カード':category==='parallel'?'第一弾のサイン入り・パラレルカード':'配布・キャンペーンのプロモーションカード';document.getElementById('grid').innerHTML=list.length?list.map(c=>`<article class="card" onclick="openDetail(${c.id})"><div class="fakeimg"><img src="${c.image}" alt="${c.code}" loading="lazy"></div><div class="info"><div class="name">${c.name&&c.name!==c.code?`${c.code}　${c.name}`:c.code}</div><div class="type">${c.type}</div>${c.saleStatus==='planned'?'<div class="status">🛍️ 売却予定</div>':c.saleStatus==='sold'?'<div class="status sold">✓ 売却済み</div>':''}<div class="row"><div class="qty"><button onclick="event.stopPropagation();changeQty(${c.id},-1)">−</button><span class="count">${c.qty}</span><button onclick="event.stopPropagation();changeQty(${c.id},1)">＋</button></div><span class="owned ${c.qty>0?'yes':''}">${c.qty>0?'✓ 所持':'未所持'}</span></div></div></article>`).join(''):`<div class="empty">該当するカードがありません</div>`;updateProgress();}
function changeQty(id,d){const c=cards.find(x=>x.id===id);c.qty=Math.max(0,c.qty+d);if(c.qty===0&&c.saleStatus!=='sold')c.saleStatus='none';save();render();}
function updateProgress(){const total=cards.length,owned=cards.filter(c=>c.qty>0).length,rate=total?Math.round(owned/total*100):0;document.getElementById('rate').textContent=rate+'%';document.getElementById('bar').style.width=rate+'%';const buyValue=cards.reduce((s,c)=>s+(Number(c.buyPrice)||0)*c.qty,0);const planned=cards.filter(c=>c.qty>0&&c.saleStatus==='planned');document.getElementById('saleBadge').textContent=planned.length?`(${planned.length})`:'';document.getElementById('summary').textContent=`${owned} / ${total}種類を所持　・　ダブり ${cards.filter(c=>c.qty>1).length}種類　・　買取合計目安 ¥${buyValue.toLocaleString()}`;if(page==='sale')renderSale();}
function renderSale(){const list=cards.filter(c=>c.qty>0&&(saleFilter==='all'||c.saleStatus===saleFilter));const total=list.reduce((s,c)=>s+(Number(c.sellPrice)||0)*c.qty,0);document.getElementById('saleTotal').textContent='¥'+total.toLocaleString();document.getElementById('saleMeta').textContent=`${saleFilter==='planned'?'売却予定':saleFilter==='sold'?'売却済み':'売却リスト全体'}：${list.length}種類・${list.reduce((s,c)=>s+c.qty,0)}枚`;document.getElementById('saleList').innerHTML=list.length?list.map(c=>`<div class="saleItem"><img class="saleThumb" src="${c.image}" alt="${c.code}"><div class="saleItemMain"><div class="saleName">${c.code}</div><div class="saleSmall">${c.qty}枚 × ¥${(Number(c.sellPrice)||0).toLocaleString()} ・ ${c.condition||'未設定'}<br>${c.memo||'メモなし'}</div></div><div class="salePrice">¥${((Number(c.sellPrice)||0)*c.qty).toLocaleString()}</div><button class="saleBtn" onclick="openDetail(${c.id})">編集</button></div>`).join(''):`<div class="empty">ここにはまだカードがありません。<br>カード詳細で「🛍️ 売却予定にする」を押してね。</div>`;}
function openDetail(id){detailId=id;const c=cards.find(x=>x.id===id);document.getElementById('detailTitle').textContent=c.name||c.code;document.getElementById('detailImg').src=c.image||'';document.getElementById('detailQty').textContent=c.qty;document.getElementById('buyPrice').value=c.buyPrice||'';document.getElementById('buyShop').value=c.buyShop||'';document.getElementById('sellPrice').value=c.sellPrice||'';document.getElementById('condition').value=c.condition||'未設定';document.getElementById('saleStatus').value=c.saleStatus||'none';document.getElementById('memo').value=c.memo||'';syncQuickSale();document.getElementById('modal').classList.add('show');}
function closeDetail(){document.getElementById('modal').classList.remove('show');detailId=null;}function detailQty(d){const c=cards.find(x=>x.id===detailId);if(!c)return;c.qty=Math.max(0,c.qty+d);document.getElementById('detailQty').textContent=c.qty;}
function toggleQuickSale(){const el=document.getElementById('saleStatus');el.value=el.value==='planned'?'none':'planned';syncQuickSale();}function syncQuickSale(){const b=document.getElementById('quickSale'),v=document.getElementById('saleStatus').value;b.classList.toggle('on',v==='planned');b.textContent=v==='planned'?'✓ 売却予定に追加済み':'🛍️ 売却予定にする';}
function saveDetail(){const c=cards.find(x=>x.id===detailId);if(!c)return;c.qty=Math.max(0,Number(document.getElementById('detailQty').textContent)||0);c.buyPrice=Number(document.getElementById('buyPrice').value)||0;c.buyShop=document.getElementById('buyShop').value.trim();c.sellPrice=Number(document.getElementById('sellPrice').value)||0;c.condition=document.getElementById('condition').value;c.saleStatus=c.qty===0?'none':document.getElementById('saleStatus').value;c.memo=document.getElementById('memo').value.trim();save();closeDetail();updateProgress();if(page==='sale')renderSale();else render();toast('保存したよ！');}
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1400);}
function exportData(){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),cards},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aikatsu-card-backup.json';a.click();URL.revokeObjectURL(a.href);toast('バックアップを作ったよ！');}
function importData(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.cards))throw Error();cards=d.cards;normalize();save();render();renderSale();toast('データを復元したよ！');}catch{alert('このバックアップファイルは読み込めませんでした。')}e.target.value='';};r.readAsText(file);}
